name: Build Mac app

# Every push to main runs the tests. When the version in pipfucci/__init__.py has no release yet,
# both DMGs are built and published as a GitHub Release (tag v<version>) automatically.
# Pushing a v* tag or clicking "Run workflow" on the Actions tab also builds them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packaging/requirements-test.txt
      - run: python -m pytest -q tests

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(python3 -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("pipfucci/__init__.py").read()).group(1))')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          echo "version $V"

  build:
    needs: [test, version]
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: aarch64-apple-darwin
            label: AppleSilicon
          - runner: macos-15-intel
            platform: x86_64-apple-darwin
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (wheels that run on macOS 12 and later)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          python -m venv .venv
          uv pip install --python .venv/bin/python --python-platform ${{ matrix.platform }} \
            --only-binary numpy --only-binary scipy --only-binary scikit-image \
            --only-binary pandas --only-binary pillow \
            -r packaging/requirements-mac.txt

      - name: Record version and repository in the app
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          printf 'GITHUB_REPO = "%s"\nBUILD_VERSION = "%s"\n' "$GITHUB_REPOSITORY" "$VERSION" > pipfucci/_build_info.py

      - name: Build PIP-FUCCI.app
        run: .venv/bin/pyinstaller packaging/pip_fucci.spec --noconfirm

      - name: Sign ad hoc (no Apple developer account)
        run: |
          codesign --force --deep --sign - dist/PIP-FUCCI.app
          codesign --verify --deep --strict --verbose=2 dist/PIP-FUCCI.app

      - name: Self-test the built app (demo data, analysis, export, server)
        run: dist/PIP-FUCCI.app/Contents/MacOS/PIP-FUCCI --selftest

      - name: Make the DMG
        run: |
          mkdir dmg
          cp -R dist/PIP-FUCCI.app dmg/
          ln -s /Applications dmg/Applications
          cp "packaging/How to open PIP-FUCCI the first time.pdf" dmg/
          for i in 1 2 3; do
            hdiutil create -volname "PIP-FUCCI" -srcfolder dmg -ov -format UDZO "PIP-FUCCI-${{ matrix.label }}.dmg" && break
            sleep 10
          done
          test -f "PIP-FUCCI-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: PIP-FUCCI-${{ matrix.label }}.dmg

  release:
    needs: [build, version]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PIP-FUCCI ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: "*.dmg"
          body: |
            **Which file?** Apple menu > About This Mac. If it says *Apple M1/M2/M3/M4…* download **PIP-FUCCI-AppleSilicon.dmg**; if it says *Intel*, download **PIP-FUCCI-Intel.dmg**.

            1. Open the DMG and drag **PIP-FUCCI** onto **Applications**.
            2. The first time only: double-click PIP-FUCCI, click **Done** on the warning, then open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**, enter your password, then **Open**.
            3. After that it opens like any other app.

            Needs macOS 12 or later.

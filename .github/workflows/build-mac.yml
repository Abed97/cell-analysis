name: Build Mac app

# Every push to main (except documentation-only changes) is tested, built for Apple silicon and
# Intel, and published as a GitHub Release numbered <major>.<minor>.<build>. Installed apps
# download the newest release in the background and switch to it the next time they open.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packaging/requirements-test.txt
      - run: python -m pytest -q tests

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE="$(python3 -c 'import re;print(".".join(re.search(r"__version__ = \"([^\"]+)\"", open("pipfucci/__init__.py").read()).group(1).split(".")[:2]))')"
          V="$BASE.$GITHUB_RUN_NUMBER"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version $V"

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: aarch64-apple-darwin
            label: AppleSilicon
          - runner: macos-15-intel
            platform: x86_64-apple-darwin
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (wheels that run on macOS 12 and later)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          python -m venv .venv
          uv pip install --python .venv/bin/python --python-platform ${{ matrix.platform }} \
            --only-binary numpy --only-binary scipy --only-binary scikit-image \
            --only-binary pandas --only-binary pillow --only-binary imagecodecs \
            -r packaging/requirements-mac.txt

      - name: Record version and repository in the app
        run: printf 'GITHUB_REPO = "%s"\nBUILD_VERSION = "%s"\n' "$GITHUB_REPOSITORY" "${{ needs.version.outputs.version }}" > pipfucci/_build_info.py

      - name: Build PIP-FUCCI.app
        run: .venv/bin/pyinstaller packaging/pip_fucci.spec --noconfirm

      - name: Sign ad hoc (no Apple developer account)
        run: |
          codesign --force --deep --sign - dist/PIP-FUCCI.app
          codesign --verify --deep --strict --verbose=2 dist/PIP-FUCCI.app

      - name: Self-test the built app (demo data, analysis, export, server)
        env:
          PIPFUCCI_NO_UPDATES: "1"
        run: |
          out="$(dist/PIP-FUCCI.app/Contents/MacOS/PIP-FUCCI --selftest)"
          echo "$out"
          grep -q "SELFTEST OK" <<<"$out"
          # Dock badge, App Nap prevention and notifications made it into the app
          grep -q "activity=True" <<<"$out"
          grep -q "usernotifications=yes" <<<"$out"
          grep -q "appkit=yes" <<<"$out"

      - name: Check https works without the build machine's certificates (as on her Mac)
        env:
          SSL_CERT_FILE: /nonexistent/cert.pem
          SSL_CERT_DIR: /nonexistent
        run: |
          out="$(dist/PIP-FUCCI.app/Contents/MacOS/PIP-FUCCI --check-ssl "https://github.com/$GITHUB_REPOSITORY/releases/latest")"
          echo "$out"
          grep -q "ssl ok via" <<<"$out"

      - name: Package the app for automatic updates
        run: |
          ditto -c -k --keepParent dist/PIP-FUCCI.app "PIP-FUCCI-${{ matrix.label }}.app.zip"
          shasum -a 256 "PIP-FUCCI-${{ matrix.label }}.app.zip" | cut -d' ' -f1 > "PIP-FUCCI-${{ matrix.label }}.app.zip.sha256"

      - name: Test the update handoff (installed app starts a newer downloaded copy)
        run: |
          export PIPFUCCI_SUPPORT_DIR="$RUNNER_TEMP/support"
          mkdir -p "$PIPFUCCI_SUPPORT_DIR/versions" "$RUNNER_TEMP/x"
          ditto -x -k "PIP-FUCCI-${{ matrix.label }}.app.zip" "$RUNNER_TEMP/x"
          mv "$RUNNER_TEMP/x/PIP-FUCCI.app" "$PIPFUCCI_SUPPORT_DIR/versions/PIP-FUCCI-999.0.0.app"
          out="$(dist/PIP-FUCCI.app/Contents/MacOS/PIP-FUCCI --whoami)"
          echo "$out"
          [[ "$out" == *"PIP-FUCCI-999.0.0.app"* ]]
          # the unzipped copy must still be runnable (signature intact after the zip round trip)
          PIPFUCCI_NO_UPDATES=1 "$PIPFUCCI_SUPPORT_DIR/versions/PIP-FUCCI-999.0.0.app/Contents/MacOS/PIP-FUCCI" --selftest

      - name: Test "Update now" (the new copy starts in the background and serves the app)
        run: |
          export PIPFUCCI_SUPPORT_DIR="$RUNNER_TEMP/support" PIPFUCCI_LAUNCHED=1
          R="$RUNNER_TEMP/ready"
          "$PIPFUCCI_SUPPORT_DIR/versions/PIP-FUCCI-999.0.0.app/Contents/MacOS/PIP-FUCCI" --serve --parent-pid $$ --ready-file "$R" &
          for i in $(seq 1 150); do [ -f "$R" ] && break; sleep 1; done
          PORT="$(cat "$R")"
          echo "backend on port $PORT"
          curl -sf "http://127.0.0.1:$PORT/api/state" | grep -q '"PIP-FUCCI"'
          curl -sf "http://127.0.0.1:$PORT/" | grep -q "CycleTrack"
          kill %1 || true

      - name: Make the DMG
        run: |
          # new installs see "CycleTrack.app"; inside, the executable keeps its internal name
          mkdir dmg
          cp -R dist/PIP-FUCCI.app dmg/CycleTrack.app
          ln -s /Applications dmg/Applications
          cp "packaging/How to open CycleTrack the first time.pdf" dmg/
          for i in 1 2 3; do
            hdiutil create -volname "CycleTrack" -srcfolder dmg -ov -format UDZO "CycleTrack-${{ matrix.label }}.dmg" && break
            sleep 10
          done
          test -f "CycleTrack-${{ matrix.label }}.dmg"
          dmg/CycleTrack.app/Contents/MacOS/PIP-FUCCI --whoami

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.label }}
          path: |
            CycleTrack-${{ matrix.label }}.dmg
            PIP-FUCCI-${{ matrix.label }}.app.zip
            PIP-FUCCI-${{ matrix.label }}.app.zip.sha256

  release:
    needs: [build, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "### What changed"
            echo
            echo "${MSG:-Manual build}"
            echo
            echo "Installed copies download this version automatically; the blue Update now button at the top right switches to it (or it switches the next time the app opens)."
            echo
            echo "**New install:** Apple menu > About This Mac shows *Apple M…* → **CycleTrack-AppleSilicon.dmg**, *Intel* → **CycleTrack-Intel.dmg**. Open it, drag CycleTrack to Applications, and follow *How to open CycleTrack the first time.pdf* inside. Needs macOS 12 or later. (The PIP-FUCCI-*.app.zip files are for automatic updates.)"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: CycleTrack ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: "true"
          files: |
            *.dmg
            *.app.zip
            *.app.zip.sha256
      - name: Keep only the 10 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
